name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Run workspace tests
              run: pnpm test

            - name: Type-check packages and tooling
              run: pnpm typecheck

            - name: Lint source
              run: pnpm lint

            - name: Run Oxlint
              run: pnpm lint:oxlint

            - name: Check Storybook configuration
              run: pnpm storybook:doctor

            - name: Build Storybook
              run: pnpm build-storybook

            - name: Upload engine coverage to Coveralls
              uses: coverallsapp/github-action@v2.3.6
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  file: packages/engine/coverage/lcov.info
                  base-path: packages/engine
