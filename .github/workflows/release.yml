name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        if: github.repository == 'aubquinn/contrast-lens' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            mode: ${{ steps.changesets.outputs.mode }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
              id: changesets

    version:
        needs: plan
        if: needs.plan.outputs.mode == 'version'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - name: Create or update release PR
              uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
              with:
                  script: pnpm release:version
                  pr-title: Release packages
                  commit-message: Version packages

    publish:
        needs: plan
        if: needs.plan.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter test-storybook exec playwright install --with-deps chromium
            - run: pnpm format:check
            - run: pnpm test
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm lint:oxlint
            - run: pnpm storybook:doctor
            - name: Validate archives and publish to npm
              uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
              with:
                  script: pnpm release
                  create-github-releases: true
                  push-git-tags: true
